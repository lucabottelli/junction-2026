<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Brick Station</title>
<meta name=color-scheme content="dark">
<link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000000'/%3E%3Crect x='8' y='13' width='16' height='10' rx='1.5' fill='%23F4F6F8'/%3E%3Crect x='10' y='9' width='4' height='4' rx='1' fill='%23F4F6F8'/%3E%3Crect x='18' y='9' width='4' height='4' rx='1' fill='%23F4F6F8'/%3E%3C/svg%3E">
<!-- The user-facing page (served at /). Standalone on purpose: no dependency on the dev interface's shell, core.js
     or style.css, so work on the dev pages (/dev, /sort, ...) can't break it.
     It only calls: /status, /arm/status, /arm/connect, /sort/status, /flow/*, /telemetry, /sort/cfg (vision_fast), /view/<cam> (camera picture without the boxes), the stops. -->
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(/static/fonts/Inter-var-latin.woff2) format("woff2")}
/* Layout: one screen. A floating glass control panel on the left; the live camera is the stage and fills the rest;
   state, progress and counts sit on the stage as one glass bar. Black and cool greys only. Blue exists only as the
   glow of buttons. Red only on STOP. */
:root{color-scheme:dark;
 --bg:#040506;--ink:#F4F6F8;--ink2:#A3A9B1;--ink3:#6A7078;--ink4:#34383E;
 --glass:rgba(20,22,26,.56);--glass-hi:rgba(34,37,43,.62);--fill:rgba(140,148,160,.14);--fill2:rgba(140,148,160,.24);
 --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--edge:rgba(255,255,255,.16);
 --blue:#7CCBFF;--glow:rgba(124,203,255,.60);--glow-soft:rgba(124,203,255,.20);
 --stop:#E23B3D;--stop-hi:#F04D4F;
 --blur:blur(34px) saturate(170%);
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
 --r-xl:28px;--r:20px;--r-m:14px;--r-s:10px;--gap:14px;
 --shadow:0 1px 0 rgba(255,255,255,.07) inset,0 0 0 1px var(--line),0 30px 80px -30px rgba(0,0,0,.9)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:400 14px/1.4 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;transition:box-shadow .25s,background .2s,color .2s,transform .12s}
button:active:not(:disabled){transform:scale(.985)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;fill:currentColor}
/* ambient: the live view, greyscale and far out of focus, behind everything, so the glass has light to bend */
#amb{position:fixed;inset:-12%;width:124%;height:124%;object-fit:cover;z-index:-2;filter:grayscale(1) blur(70px) brightness(.42) contrast(1.1);opacity:0;transition:opacity 1.2s}
#amb.on{opacity:1}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 90% at 70% 40%,transparent 30%,rgba(4,5,6,.78))}
body.pre *,body.pre *::after,body.pre *::before{transition:none!important}

.app{display:grid;grid-template-columns:308px minmax(0,1fr);gap:var(--gap);height:100%;padding:var(--gap)}

/* ---------- control panel ---------- */
.panel{display:flex;flex-direction:column;gap:18px;padding:20px 16px 16px;border-radius:var(--r-xl);background:linear-gradient(180deg,var(--glass-hi),var(--glass));box-shadow:var(--shadow);
 -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(160deg,#fff,#B9C0C9);display:grid;place-items:center;box-shadow:0 4px 14px -4px rgba(255,255,255,.35)}
.brand .mark svg{width:15px;height:15px;fill:#0B0C0E}
.brand b{font-weight:600;font-size:15.5px;letter-spacing:-.02em}
.brand .sp{flex:1}
.ghost{padding:6px 11px;border-radius:999px;color:var(--ink3);font-size:12.5px}
.ghost:hover,.menu.open .ghost{color:var(--ink);background:var(--fill);box-shadow:0 0 18px var(--glow-soft)}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:190px;padding:6px;background:rgba(36,39,45,.82);border-radius:var(--r-m);box-shadow:var(--shadow);z-index:10;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.menu.open .pop{display:block}
.menu .pop a{display:block;padding:8px 12px;border-radius:var(--r-s);color:var(--ink);text-decoration:none;font-size:13.5px}
.menu .pop a:hover{background:rgba(255,255,255,.09)}

.group{border-radius:var(--r);background:rgba(0,0,0,.22);box-shadow:0 0 0 1px var(--line)}
.rowi{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;font-size:14px}
.rowi+.rowi{border-top:1px solid var(--line)}
.rowi .v{margin-left:auto;color:var(--ink2);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink3);flex:none}
.dot.ok{background:var(--ink);box-shadow:0 0 10px rgba(255,255,255,.5)}
.dot.acc{background:var(--ink);box-shadow:none;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.mini{margin-left:auto;padding:6px 13px;border-radius:999px;background:var(--fill2);font-size:12.5px;font-weight:600}
.mini:hover,.mini:focus-visible{box-shadow:0 0 0 1px var(--glow),0 0 22px var(--glow)}
.mini:disabled{color:var(--ink3);cursor:default;box-shadow:none}

.ctl{display:grid;gap:14px;padding:0 2px}
/* system: live SoC power, temperature and per-device load (GET /telemetry, 1 Hz) */
.sys{display:grid;gap:7px}
.sys>.l{font-size:12px;font-weight:500;color:var(--ink3);padding-left:6px}
.sys .group{display:grid;gap:10px;padding:12px 14px}
.sys .big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sys .big div{display:grid;gap:3px}
.sys .n{font-size:20px;font-weight:300;line-height:1;letter-spacing:-.03em}.sys .n small{font-size:11.5px;color:var(--ink3);margin-left:3px;letter-spacing:0}
.sys .k{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sys svg{width:100%;height:24px;display:block;overflow:visible}
.sys svg path{fill:none;stroke:var(--ink2);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.sys .dev{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sys .dev div{display:grid;gap:5px}
.sys .dev .t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3)}.sys .dev .t b{font-weight:500;color:var(--ink2)}
/* short screens: Start and Stop must stay on screen, so the system card drops its label and sparkline first */
@media (max-height:880px){.panel{gap:12px}.sys>.l,.sys svg{display:none}}
.panel{scrollbar-width:thin;scrollbar-color:var(--ink4) transparent}
.sys .bar{height:3px;border-radius:2px;background:var(--fill)}.sys .bar i{display:block;height:100%;border-radius:2px;background:var(--ink2);transition:width .6s}
.field{display:grid;gap:7px}
.field>.l{font-size:12px;font-weight:500;color:var(--ink3);padding-left:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:rgba(0,0,0,.30);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{padding:8px 4px;border-radius:9px;color:var(--ink2);font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button:disabled{color:var(--ink4);cursor:not-allowed}
/* accept-plate switch: the chosen (accept) plate is tinted green, the other (reject) plate slightly red */
#seg-accept button.on{background:linear-gradient(180deg,rgba(96,214,140,.34),rgba(96,214,140,.20));color:#D9F7E4;box-shadow:0 1px 0 rgba(255,255,255,.16) inset,inset 0 0 0 1px rgba(96,214,140,.45),0 2px 8px rgba(0,0,0,.45)}
#seg-accept button:not(.on){background:rgba(226,59,61,.10);color:#E9B4B5;box-shadow:inset 0 0 0 1px rgba(226,59,61,.20)}
#seg-accept button:not(.on):hover{background:rgba(226,59,61,.16);color:#F4CFD0}
#seg-accept{gap:3px}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.12));color:var(--ink);font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 8px rgba(0,0,0,.45)}
.seg button:focus-visible{box-shadow:0 0 0 1px var(--glow),0 0 16px var(--glow-soft)}
.sw{position:relative;width:48px;height:28px;border-radius:999px;background:var(--fill2);flex:none;margin-left:auto}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .22s cubic-bezier(.3,.9,.3,1)}
.sw.on{background:rgba(255,255,255,.62)}.sw.on::after{transform:translateX(20px)}
.sw:hover,.sw:focus-visible{box-shadow:0 0 20px var(--glow-soft)}

.sp{flex:1;min-height:0}
.why{display:grid;gap:4px;font-size:12.5px;color:var(--ink2);padding:0 8px}
.why:empty{display:none}
.actions{display:grid;gap:9px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:52px;border-radius:16px;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.btn.go{background:linear-gradient(180deg,#FFFFFF,#DDE3EA);color:#07090B;box-shadow:0 0 0 1px var(--glow),0 0 30px 0 var(--glow),0 0 90px 4px var(--glow-soft),0 1px 0 #fff inset}
.btn.go:hover,.btn.go:focus-visible{box-shadow:0 0 0 1.5px var(--blue),0 0 40px 4px var(--glow),0 0 120px 14px var(--glow-soft),0 1px 0 #fff inset}
.btn.hold{background:var(--fill2);color:var(--ink);box-shadow:0 0 0 1px var(--glow-soft),0 0 26px var(--glow-soft),0 1px 0 rgba(255,255,255,.1) inset}
.btn.hold:hover,.btn.hold:focus-visible{box-shadow:0 0 0 1px var(--glow),0 0 34px var(--glow),0 1px 0 rgba(255,255,255,.1) inset}
.btn:disabled{background:var(--fill);color:var(--ink3);box-shadow:none;cursor:not-allowed}
.btn.stop{height:46px;background:rgba(226,59,61,.14);color:#FF8587;box-shadow:inset 0 0 0 1px rgba(226,59,61,.42);font-size:14px}
.btn.stop:hover,.btn.stop.live{background:var(--stop);color:#fff;box-shadow:0 10px 30px -10px rgba(226,59,61,.9)}
.btn.stop.live:hover{background:var(--stop-hi)}
kbd{font:500 11px/1 var(--sans);padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.24);color:inherit;opacity:.8}

/* ---------- stage ---------- */
.stage{position:relative;border-radius:var(--r-xl);overflow:hidden;background:#000;box-shadow:var(--shadow);min-height:0;min-width:0}
.stage>img.live{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--edge);
 background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 18%,transparent 62%,rgba(0,0,0,.55))}
.tag{position:absolute;left:18px;top:18px;z-index:2;display:flex;align-items:center;gap:8px;padding:7px 13px 7px 11px;border-radius:999px;background:rgba(24,26,30,.5);font-size:13px;font-weight:600;
 box-shadow:0 0 0 1px var(--line2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.pips{position:absolute;right:18px;top:18px;z-index:2;display:grid;gap:10px;width:clamp(150px,19%,260px)}
.pip{position:relative;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--edge),0 18px 40px -12px rgba(0,0,0,.9)}
.pip:hover,.pip:focus-visible{box-shadow:0 0 0 1.5px var(--blue),0 0 30px var(--glow),0 18px 40px -12px rgba(0,0,0,.9)}
.pip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pip span{position:absolute;left:8px;bottom:7px;font-size:11.5px;font-weight:600;text-shadow:0 1px 6px #000}

.island{position:absolute;left:18px;right:18px;bottom:18px;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:26px;padding:16px 22px;border-radius:24px;
 background:linear-gradient(180deg,rgba(40,43,49,.56),rgba(18,20,24,.56));box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 0 0 1px var(--line2),0 30px 70px -24px #000;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.now{min-width:0}
.now .st{font-size:21px;font-weight:600;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .ms{color:var(--ink2);font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now .ms:empty{display:none}
.steps{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink3)}
.steps span{display:flex;align-items:center;gap:8px;white-space:nowrap}
.steps span+span::before{content:"";width:18px;height:1px;background:var(--ink4)}
.steps .done{color:var(--ink2)}.steps .cur{color:var(--ink)}
.steps .cur b{font-weight:600}
.steps b{font-weight:500}
.sides{display:inline-flex;gap:3px;margin-left:2px}
.sides i{width:5px;height:5px;border-radius:50%;background:var(--ink4)}.sides i.on{background:var(--ink)}
.lat{display:flex;gap:18px;padding-right:20px;border-right:1px solid var(--line2)}
.lat div{display:grid;justify-items:start;gap:3px}
.lat .n{font-size:17px;font-weight:400;line-height:1;letter-spacing:-.02em;white-space:nowrap}.lat .n small{font-size:11.5px;color:var(--ink3);margin-left:3px}
.lat .k{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.tot{display:flex;gap:6px}
.tot button{display:grid;justify-items:center;gap:3px;min-width:74px;padding:8px 10px;border-radius:var(--r-m)}
.tot button:hover,.tot button:focus-visible{background:var(--fill);box-shadow:0 0 22px var(--glow-soft)}
.tot .n{font-size:26px;font-weight:300;line-height:1;letter-spacing:-.03em}
.tot .k{font-size:11.5px;color:var(--ink3)}
.tot .x .n{color:var(--ink3)}.tot .r .n{color:var(--ink2)}

.sheet{position:absolute;right:18px;bottom:112px;z-index:3;width:min(560px,calc(100% - 36px));max-height:46%;overflow-y:auto;padding:4px 18px;border-radius:var(--r);
 background:rgba(22,24,28,.66);box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);display:none}
.sheet.open:not(:empty){display:block}
.sheet .row{display:grid;grid-template-columns:22px 52px 76px minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:11px 0;font-size:13px}
.sheet .row+.row{border-top:1px solid var(--line)}
.sheet .n{color:var(--ink3)}.sheet .why2{color:var(--ink2);overflow-wrap:anywhere}
.v-accept{font-weight:600}.v-reject{font-weight:600;color:var(--ink2)}.v-aborted{color:var(--ink3)}

#toasts{position:fixed;left:50%;top:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:30;justify-items:center}
.toast{padding:10px 18px;border-radius:999px;background:rgba(40,43,49,.8);box-shadow:var(--shadow);font-size:13.5px;max-width:min(560px,90vw);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
:focus-visible{outline:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1380px){.island{grid-template-columns:minmax(0,1fr) auto auto}.steps{display:none}}
@media (max-width:860px){body{overflow:auto}html,body{height:auto}.app{grid-template-columns:1fr;height:auto}.panel{overflow:visible}
 .stage{aspect-ratio:4/3}.island{grid-template-columns:1fr;gap:10px;padding:14px 16px}.lat{border-right:0;padding-right:0;justify-content:space-between}.tot{justify-content:space-between}.pips{width:30%}.sheet{bottom:auto;top:18px;left:18px;right:18px;width:auto}}
</style></head><body class=pre>
<img id=amb alt="">
<div class=app>
<aside class=panel>
 <div class=brand>
  <span class=mark><svg viewBox="0 0 16 16"><rect x="1.5" y="6" width="13" height="8" rx="1.4"/><rect x="3.2" y="2.6" width="3.4" height="3.4" rx=".9"/><rect x="9.4" y="2.6" width="3.4" height="3.4" rx=".9"/></svg></span>
  <b>Brick Station</b><span class=sp></span>
  <div class=menu id=devmenu>
   <button type=button class=ghost onclick="toggleMenu(event)" aria-haspopup=true>Dev</button>
   <div class=pop>
    <a href="/dev">Overview</a><a href="/connect">Connect</a><a href="/waypoints">Waypoints</a><a href="/sort">Inspect &amp; sort</a><a href="/anomaly">Anomaly photos</a>
   </div>
  </div>
 </div>

 <div class=group>
  <div class=rowi><span class=dot id=armdot></span><span>Arm</span><span class=v id=armtxt></span><button type=button class=mini id=connect onclick="connectArm()" hidden>Take control</button></div>
  <div class=rowi><span class=dot id=camdot></span><span>Cameras</span><span class=v id=camtxt></span></div>
 </div>

 <div class=ctl>
  <div class=field><div class=l>Blocks</div><div class=seg id=seg-n></div></div>
  <div class=field><div class=l>Colour</div><div class=seg id=seg-colour></div></div>
  <div class=field><div class=l>Accept plate</div><div class=seg id=seg-accept></div></div>
 </div>
 <div class=group><div class=rowi><span>Fast pick</span><button type=button class=sw id=sw-fast onclick="setFast()" aria-label="Fast pick"></button></div>
  <div class=rowi><span>Fast moves</span><button type=button class=sw id=sw-mfast onclick="setMFast()" aria-label="Fast moves"></button></div></div>

 <div class=sys id=sys hidden>
  <div class=l>System</div>
  <div class=group>
   <div class=big>
    <div><span class="n num" id=sy-w>–</span><span class=k>Package power</span></div>
    <div><span class="n num" id=sy-t>–</span><span class=k id=sy-h>Temperature</span></div>
   </div>
   <svg viewBox="0 0 120 24" preserveAspectRatio=none aria-hidden=true><path id=sy-spark d=""/></svg>
   <div class=dev id=sy-dev></div>
  </div>
 </div>

 <span class=sp></span>
 <div class=why id=why></div>
 <div class=actions>
  <button type=button class="btn go" id=primary onclick="primary()" disabled></button>
  <button type=button class="btn stop" id=stop onclick="stopAll()" title="Freeze the arm (it keeps holding its position)">Stop <kbd>Space</kbd></button>
 </div>
</aside>

<main class=stage id=stage>
 <img class=live id=live alt="">
 <div class=tag><span class="dot ok" id=livedot></span><span id=livename></span></div>
 <div class=pips id=pips></div>
 <div class=sheet id=sheet></div>
 <section class=island>
  <div class=now><div class=st id=now-st>Idle</div><div class=ms id=now-ms></div></div>
  <div class=steps id=steps></div>
  <div class=lat id=lat title="Timings of the last sorted block"></div>
  <div class=tot id=tot title="Show or hide the results">
   <button type=button onclick="toggleSheet()"><span class="n num" id=t-a>0</span><span class=k>Accepted</span></button>
   <button type=button class=r onclick="toggleSheet()"><span class="n num" id=t-r>0</span><span class=k>Rejected</span></button>
   <button type=button class=x onclick="toggleSheet()"><span class="n num" id=t-x>0</span><span class=k>Aborted</span></button>
  </div>
 </section>
</main>
</div>
<div id=toasts aria-live=polite></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAMS=[['front','Front'],['top','Top'],['wrist','Wrist']];
const PLATE={plate_a:'Plate A',plate_b:'Plate B'};
const STATE={idle:'Idle',vision:'Picking',look:'Looking',place:'Setting down',inspect:'Inspecting',judge:'Judging',regrasp:'Re-clamping',
 sort_good:'To the accept plate',sort_defect:'To the reject plate',done:'Done',stopped:'Stopped',error:'Needs attention'};
const STEPS=[['Pick',['vision','look','place']],['Inspect',['inspect','judge']],['Re-clamp',['regrasp']],['Sort',['sort_good','sort_defect']]];
const ICON={play:'<svg class=i viewBox="0 0 16 16"><path d="M4.2 2.3v11.4a.6.6 0 0 0 .92.5l8.9-5.7a.6.6 0 0 0 0-1L5.12 1.8a.6.6 0 0 0-.92.5z"/></svg>',
 pause:'<svg class=i viewBox="0 0 16 16"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg>'};
let S=null,A=null,SO=null,FL=null,TM=null,flowMissing=false,connecting=false,sel={n:1,colour:'',cam:'front',sheet:false};
try{Object.assign(sel,JSON.parse(localStorage.getItem('op-sel')||'{}'))}catch(e){}
if(!CAMS.some(c=>c[0]==sel.cam))sel.cam='front';

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('toasts').appendChild(t);
 while($('toasts').children.length>2)$('toasts').firstChild.remove();setTimeout(()=>t.remove(),6000)}
async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function post(u){try{const r=await fetch(u,{method:'POST'});if(!r.ok)throw new Error(r.status+' '+r.statusText);const j=await r.json();await refresh();return j}
 catch(e){toast('Request failed: '+e.message);return null}}
function setH(id,h){const e=$(id);if(e&&e._h!==h){e.innerHTML=h;e._h=h}}
function saveSel(){try{localStorage.setItem('op-sel',JSON.stringify(sel))}catch(e){}render()}

/* ---------- cameras: refreshed snapshots (no open streams) ---------- */
function loop(img,cam,ms){const tick=()=>{if(!img.isConnected)return;if(document.hidden){setTimeout(tick,600);return}img.src='/view/'+cam()+'?t='+Date.now()};
 img.onload=()=>setTimeout(tick,ms);img.onerror=()=>setTimeout(tick,1500);tick()}
function buildCams(){
 loop($('live'),()=>sel.cam,110);
 const amb=$('amb');amb.onload=()=>amb.classList.add('on');const at=()=>{if(!document.hidden)amb.src='/view/'+sel.cam+'?a='+Date.now()};at();setInterval(at,2500);
 pips()}
function pips(){$('livename').textContent=CAMS.find(c=>c[0]==sel.cam)[1];
 $('pips').innerHTML=CAMS.filter(c=>c[0]!=sel.cam).map(([c,t])=>`<button type=button class=pip data-c=${c} aria-label="Show the ${t} camera"><img id=pip-${c} alt=""><span>${t}</span></button>`).join('');
 CAMS.filter(c=>c[0]!=sel.cam).forEach(([c])=>loop($('pip-'+c),()=>c,320))}
$('pips').onclick=e=>{const b=e.target.closest('.pip');if(b){sel.cam=b.dataset.c;pips();saveSel()}};

/* ---------- controls ---------- */
function seg(id,opts,cur,fn,off){setH(id,opts.map(([v,t])=>`<button type=button class="${String(v)==String(cur)?'on':''}" data-v="${esc(v)}"${off&&off(v)?' disabled':''}>${esc(t)}</button>`).join(''));
 $(id).onclick=e=>{const b=e.target.closest('button');if(b)fn(b.dataset.v)}}
function toggleMenu(e){e.stopPropagation();$('devmenu').classList.toggle('open')}
document.addEventListener('click',()=>$('devmenu').classList.remove('open'));
function toggleSheet(){sel.sheet=!sel.sheet;saveSel()}
function setFast(){if(SO)post('/sort/cfg?vision_fast='+(SO.cfg.vision_fast?0:1))}
function setMFast(){if(SO)post('/sort/cfg?motion_fast='+(SO.cfg.motion_fast?0:1))}
function stopAll(){['/flow/stop','/sort/stop','/collect/stop','/arm/stop'].forEach(u=>fetch(u,{method:'POST'}).catch(()=>{}));toast('Stopped. The arm holds its position.');setTimeout(refresh,300)}
document.addEventListener('keydown',e=>{if((e.code=='Space'||e.key=='Escape')&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();stopAll()}});
async function connectArm(){if(connecting)return false;connecting=true;render();
 try{await post('/arm/connect');if(!A||!A.connected){toast((A&&A.msg)||'Could not take control of the arm');return false}return true}
 finally{connecting=false;render()}}
async function start(){if(!(A&&A.connected)&&!(await connectArm()))return;            // Start takes control of the arm by itself
 const j=await post(`/flow/start?n=${sel.n}&colour=${encodeURIComponent(sel.colour)}`);if(j&&j.started===false)toast(j.msg||'Could not start')}
function primary(){if(FL&&FL.running)post(FL.pause?'/flow/resume':'/flow/pause');else start()}

/* ---------- render ---------- */
function problems(){const p=[];
 if(!S)p.push('Server not answering');
 if(flowMissing)p.push('Sort task not loaded: restart the tool');
 if(S){const bad=['top','front'].filter(c=>!(S.live||[]).includes(c));if(bad.length)p.push('Camera down: '+bad.join(', '))}
 if(FL){const un=Object.entries(FL.plates||{}).filter(([k,v])=>!v).map(([k])=>PLATE[k]||k);if(un.length)p.push(un.join(' and ')+' not taught')}
 return p}
function spark(v){const p=v.filter(x=>x!=null);if(p.length<2)return'';const lo=Math.min(...p),hi=Math.max(...p),r=Math.max(hi-lo,2),n=v.length;
 let d='',pen=false;v.forEach((x,i)=>{if(x==null){pen=false;return}const X=(i/(n-1)*120).toFixed(1),Y=(22-(x-lo)/r*20).toFixed(1);d+=(pen?'L':'M')+X+' '+Y;pen=true});return d}
function renderSys(){const t=TM;$('sys').hidden=!(t&&t.ok);if(!t||!t.ok)return;
 setH('sy-w',t.pkg_w!=null?`${t.pkg_w.toFixed(1)}<small>W</small>`:'–');
 setH('sy-t',t.temp_c!=null?`${Math.round(t.temp_c)}<small>°C</small>`:'–');
 $('sy-h').textContent=t.headroom_c!=null?`${Math.round(t.headroom_c)} °C headroom`:'Temperature';
 $('sy-spark').setAttribute('d',spark(((t.history||{}).pkg_w||[]).slice(-60)));
 setH('sy-dev',[['iGPU',t.gpu_pct],['NPU',t.npu_pct],['CPU',t.cpu_pct]].map(([k,v])=>`<div><span class=t>${k}<b class=num>${v!=null?Math.round(v)+'%':'–'}</b></span><span class=bar><i style="width:${v!=null?Math.max(0,Math.min(100,v)):0}%"></i></span></div>`).join(''))}
function render(){
 renderSys();
 const live=S?(S.live||[]):[],conn=!!(A&&A.connected);
 $('camdot').className='dot '+(S&&live.length>=3?'ok':'');$('camtxt').textContent=!S?'Offline':live.length+' live';
 $('livedot').className='dot '+(live.includes(sel.cam)?'ok':'');
 $('armdot').className='dot '+(!conn?'':A.running?'acc':'ok');
 $('armtxt').textContent=conn?(A.running?'Moving':'Ready'):'';$('armtxt').hidden=!conn;
 $('connect').hidden=conn||!A;$('connect').disabled=connecting;$('connect').textContent=connecting?'Connecting':'Take control';
 const running=!!(FL&&FL.running),busy=!!(SO&&SO.active)||!!(A&&A.running),pausing=running&&FL.pause&&!FL.paused,paused=running&&FL.paused;
 // three blocks, one per colour: a chosen colour means exactly 1 block; with Any, 1 to 3
 if(![1,2,3].includes(sel.n)||sel.colour)sel.n=1;
 seg('seg-n',[[1,'1'],[2,'2'],[3,'3']],sel.n,v=>{sel.n=+v;saveSel()},v=>!!sel.colour&&+v>1);
 seg('seg-colour',[['','Any'],['pink','Pink'],['blue','Blue'],['green','Green']],sel.colour,v=>{sel.colour=v;if(v)sel.n=1;saveSel()});
 seg('seg-accept',[['plate_a','Plate A'],['plate_b','Plate B']],FL?FL.cfg.accept:'plate_a',v=>{if(running){toast('Not while sorting');return}post('/flow/cfg?accept='+v)});
 $('sw-fast').classList.toggle('on',!!(SO&&SO.cfg&&SO.cfg.vision_fast));
 $('sw-mfast').classList.toggle('on',!!(SO&&SO.cfg&&SO.cfg.motion_fast));
 const pr=problems(),b=$('primary');
 if(running){b.className='btn '+(FL.pause?'go':'hold');b.disabled=false;setH('primary',FL.pause?ICON.play+'Resume':ICON.pause+'Pause')}
 else{b.className='btn go';b.disabled=connecting||busy||pr.length>0;setH('primary',connecting?'Connecting':ICON.play+'Start')}
 $('stop').classList.toggle('live',running||busy);
 setH('why',running?'':pr.map(x=>`<div>${esc(x)}</div>`).join('')||(busy?'<div>Arm busy with a dev job</div>':''));
 const st=SO?SO.state:'idle',own=running||!!(FL&&FL.session&&SO&&SO.session==FL.session),cur=FL&&FL.cur||{};
 let title=paused?'Paused':pausing?'Pausing':own?(STATE[st]||st):busy?'Busy':'Idle';
 if(running&&cur.block&&!paused&&!pausing)title+=` · block ${cur.block}`+(cur.brick?`, ${cur.brick}`:'');
 $('now-st').textContent=title;
 $('now-ms').textContent=pausing?'Finishing the current move':(own||busy)&&SO&&SO.msg?SO.msg.split(' · log:')[0]:'';
 const at=STEPS.findIndex(x=>x[1].includes(st)),need=cur.sides_need||4,sides=cur.sides||0;
 setH('steps',STEPS.map(([t],i)=>`<span class="${running&&i==at?'cur':running&&at>i?'done':''}"><b>${t}</b>${i==1&&running?`<i class=sides>${Array.from({length:need},(_,k)=>`<i class="${k<sides?'on':''}"></i>`).join('')}</i>`:''}</span>`).join(''));
 const t=FL?FL.totals:{};$('t-a').textContent=t.accept||0;$('t-r').textContent=t.reject||0;$('t-x').textContent=t.aborted||0;
 const h=FL?FL.history||[]:[];$('sheet').classList.toggle('open',!!sel.sheet);
 const L=h.find(r=>r.t_cycle_s!=null)||{},Li=h.find(r=>r.infer_ms_mean!=null)||{},f=(v,u)=>v!=null?`${v}<small>${u}</small>`:'–';
 setH('lat',[['Inference'+(Li.device?' · '+esc(Li.device):''),f(Li.infer_ms_mean,'ms')],['Pick',f(L.t_pick_s,'s')],['Inspect',f(L.t_inspect_s,'s')],['Sort',f(L.t_sort_s,'s')],['Cycle',f(L.t_cycle_s,'s')],['Energy',L.energy_j==null?'–':L.energy_j>=1000?f((L.energy_j/1000).toFixed(1),'kJ'):f(Math.round(L.energy_j),'J')]]
  .map(([k,v])=>`<div><span class="n num">${v}</span><span class=k>${k}</span></div>`).join(''));
 setH('sheet',h.map(r=>`<div class=row><span class="n num">${r.block}</span><span>${esc(r.brick||'')}</span><span class="v-${esc(r.verdict)}">${esc(({accept:'Accepted',reject:'Rejected',aborted:'Aborted'})[r.verdict]||r.verdict)}</span><span class=why2>${esc(r.reason||'')}</span><span class="n num">${r.infer_ms_mean!=null?r.infer_ms_mean+' ms':''}</span><span class="n num">${r.t_cycle_s!=null?r.t_cycle_s+' s':''}</span></div>`).join(''))}

/* ---------- polling ---------- */
async function refresh(){
 const r=await Promise.allSettled([get('/status'),get('/arm/status'),get('/sort/status'),get('/flow/status'),get('/telemetry?history=1')]);
 TM=r[4].status=='fulfilled'?r[4].value:null;
 S=r[0].status=='fulfilled'?r[0].value:null;A=r[1].status=='fulfilled'?r[1].value:null;SO=r[2].status=='fulfilled'?r[2].value:null;
 if(r[3].status=='fulfilled'){FL=r[3].value;flowMissing=false}else{FL=null;flowMissing=!!S&&String(r[3].reason&&r[3].reason.message)=='404'}
 render();if(S||A||SO)requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('pre')))}
buildCams();refresh();setInterval(()=>{if(!document.hidden)refresh()},700);
</script>
</body></html>
