<div class=app>
<aside class=side>
 <a class=brand href="/"><span class=wm>Brick <i>Station</i></span><span class=tag>SO-101 · Junction 2026</span></a>
 <nav class=nav id=nav aria-label="Pages"><!-- built by core.js from the page sections --></nav>
 <div class=side-foot>
  <div class=kr><span>Stop the arm</span><span><kbd>Space</kbd><kbd>Esc</kbd></span></div>
  <div class=kr><span>Grasped · discard</span><span><kbd>G</kbd><kbd>X</kbd></span></div>
  <div class=kr><span>Next · match anyway</span><span><kbd>N</kbd><kbd>K</kbd></span></div>
 </div>
</aside>

<div class=main>
<header class=top>
 <div class=state>
  <span class=pill id=pill><span class=dot></span><span id=pilltxt>Loading</span></span>
  <span class=prog id=prog></span>
  <span class=msg id=statemsg></span>
 </div>
 <div class=health>
  <a class=chip id=armchip href="/connect"><span class=dot></span><span>Arm</span></a>
  <a class=chip id=camchip href="/connect"><span class=dot></span><span>Cameras</span></a>
 </div>
 <span class=sep></span>
 <button id=stop onclick="stopAll()" title="Freeze the arm and stop recording (it keeps holding its position)"><svg class=i><use href="#i-stop"/></svg>STOP<kbd>Space</kbd></button>
</header>

<main class=content id=content>
{{PAGES}}
</main>
</div></div>
<div id=toasts aria-live=polite></div>
<div class=modal id=modal role=dialog aria-modal=true><div class=box><h3 id=mt></h3><p id=mb></p><div class=row><button class=btn id=mno>Cancel</button><button class="btn primary" id=myes>OK</button></div></div></div>
{{SCRIPTS}}
</body></html>
